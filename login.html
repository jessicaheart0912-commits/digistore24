<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in — Business Korean for SUCCESS</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.lg{min-height:calc(100vh - 80px);display:grid;grid-template-columns:1fr 1fr}
.lg .art{background:var(--ink);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg .jg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:420px}
.lg .jg i{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--disp);font-size:44px;color:#fff}
.lg .art h2{font-size:40px;font-weight:900;margin-top:40px}
.lg .art p{color:#CFCBE0;font-size:17px;margin-top:10px;max-width:420px}
.lg .fm{display:flex;align-items:center;justify-content:center;padding:48px}
.lg form{width:100%;max-width:420px}
.lg h1{font-size:40px;font-weight:900}
.lg .sub{color:var(--ink2);margin:8px 0 28px}
.lg .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:-4px 0 22px}
.lg .row a{color:var(--blu);font-weight:600;text-decoration:none}
.lg .btn{width:100%}
.lg .or{text-align:center;margin-top:28px;font-size:15px;color:var(--ink2)}
.lg .demo{margin-top:26px}
@media (max-width:860px){.lg{grid-template-columns:1fr}.lg .art{display:none}}
</style></head>
<body>
<div id="site-header"></div>
<div class="lg">
  <div class="art">
    <div>
      <div class="jg"><i style="background:var(--red)">비</i><i style="background:var(--yel);color:var(--ink)">즈</i><i style="background:var(--blu)">니</i><i style="background:var(--grn)">스</i><i style="background:var(--pnk)">한</i><i style="background:var(--pur)">국</i><i style="background:var(--red)">어</i><i style="background:var(--yel)"></i></div>
      <h2>다시 오셨네요!<br>Welcome back.</h2>
      <p>Pick up right where you left off. Your progress is saved automatically.</p>
    </div>
    <div class="band" style="border-radius:6px"></div>
  </div>
  <div class="fm">
    <form id="f" novalidate>
      <h1>Student log in</h1>
      <p class="sub">Use the email you used at checkout.</p>
      <div class="field"><label for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="you@company.com" required></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      <div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" checked> Remember me</label><a href="#" id="forgot">Forgot password?</a></div>
      <div class="err" id="err"></div>
      <button class="btn btn-ink btn-lg" type="submit">Log in →</button>
      <p class="or">Not a student yet? <a href="index.html#enroll" style="font-weight:700">Enroll now</a></p>

    </form>
  </div>
</div>
<script src="assets/site.js"></script>
<script>
if (AUTH.get()) location.replace(new URLSearchParams(location.search).get('next') || 'classroom.html');
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e').value.trim(), p = document.getElementById('p').value;
  const err = document.getElementById('err'); err.textContent = '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { err.textContent = 'Please enter a valid email address.'; return; }
  if (!p) { err.textContent = 'Please enter your password.'; return; }
  try {
    const r = await AUTH.api('/api/login', { email: e, password: p });
    AUTH.login(r.email, r.token);
    location.href = new URLSearchParams(location.search).get('next') || 'classroom.html';
  } catch (x) { err.textContent = x.message; }
};
document.getElementById('forgot').onclick = (e) => { e.preventDefault(); toast('Please email ' + CONFIG.supportEmail + ' with your order ID — we will reset it for you.'); };
</script>
</body></html>
